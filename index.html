<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Naser Travel &amp; Tours — Lobby Display</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* ============================================================
     PALETTE — taken from the Al-Naser logo
     navy #1C3F95 · crimson #C41230 · green #47AA42
     ============================================================ */
  :root{
    --paper:    #E7EBF2;
    --paper-lo: #D2DAE8;
    --card:     #FFFFFF;
    --dial-hi:  #FFFFFF;
    --dial-lo:  #F1F4FA;
    --navy:     #1C3F95;
    --crimson:  #C41230;
    --green:    #2F8C2B;   /* the logo green, darkened so it reads on white */
    --muted:    #6B7A94;
    --rule:     rgba(28,63,149,.13);

    --face: clamp(72px, min(20vw, 26vh), 290px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }

  body{
    background: radial-gradient(135% 100% at 50% 30%, var(--paper) 0%, var(--paper-lo) 100%);
    color: var(--navy);
    font-family: Optima, "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
    padding: clamp(14px, 3vh, 40px) clamp(16px, 3vw, 56px) clamp(10px, 2vh, 26px);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body.idle{ cursor: none; }

  /* ---------- masthead ---------- */
  .mark{
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    min-height: clamp(34px, 7.5vh, 88px);
  }
  .mark img{
    max-height: clamp(34px, 7.5vh, 88px);
    max-width: min(46vw, 540px);
    width: auto; object-fit: contain; display: block;
  }
  .mark .wordmark{
    font-size: clamp(14px, 2vh, 24px); font-weight: 600;
    letter-spacing: .3em; text-indent: .3em; color: var(--navy);
  }

  /* the logo doubles as the full-screen switch */
  .logo-btn{
    background:none; border:0; margin:0; padding:0; font:inherit; color:inherit;
    display:flex; align-items:center; justify-content:center; line-height:0;
    border-radius:8px; cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition: transform .28s cubic-bezier(.22,.9,.26,1), opacity .28s ease;
  }
  .logo-btn:hover{ transform: scale(1.035); opacity:.9; }
  .logo-btn:active{ transform: scale(.985); }
  .logo-btn:focus-visible{ outline:2px solid var(--crimson); outline-offset:8px; }
  body.idle .logo-btn{ cursor:none; }
  @media (prefers-reduced-motion: reduce){ .logo-btn{ transition:none; } }

  /* ---------- scene stage ---------- */
  .stage{ position: relative; flex: 1 1 auto; min-height: 0; }
  .scene{
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity .7s ease;
  }
  .scene.on{ opacity: 1; pointer-events: auto; }

  /* ---------- scene 1: clocks ---------- */
  .row{
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-wrap: wrap;
    align-content: center; justify-content: center;
    gap: clamp(12px,2.2vh,34px) clamp(6px,1.2vw,30px);
    width: 100%;
    --cols: 4;
    --colgap: clamp(6px,1.2vw,30px);
  }
  .clock{ display:flex; flex-direction:column; align-items:center;
          text-align:center; min-width:0;
          flex: 0 0 auto;
          width: calc((100% - (var(--cols) - 1) * var(--colgap)) / var(--cols)); }

  /* the shadow sits on a wrapper, not on the SVG — an SVG filter would
     force the whole dial to re-rasterise on every frame of the sweep */
  .dial{
    border-radius: 50%; line-height: 0;
    box-shadow: 0 12px 30px rgba(28,63,149,.18), 0 2px 6px rgba(28,63,149,.10);
  }
  .clock svg{ width: var(--face); height: var(--face); display:block; }

  .rim      { fill:none; stroke:var(--navy); stroke-opacity:.30; stroke-width:1; }
  .edge     { fill:none; stroke:var(--navy); stroke-opacity:.10; stroke-width:1.2; }
  .baton    { fill:var(--navy); fill-opacity:.85; }
  .baton.qtr{ fill-opacity:1; }
  .tick     { fill:var(--navy); fill-opacity:.30; }
  .h-hand,
  .m-hand   { fill:var(--navy); }
  .s-hand   { fill:var(--crimson); }
  .cap      { fill:var(--crimson); }
  .cap-in   { fill:var(--dial-hi); }

  /* two lines are reserved for every name so the dials stay on one baseline
     even where a name is long enough to break */
  .city{ font-size: clamp(12px,1.95vh,27px); font-weight:600;
         letter-spacing:.05em; line-height:1.18; white-space:pre-line;
         display:flex; align-items:center; min-height:2.36em;
         margin-top: clamp(6px,1.1vh,15px); }
  .country{ font-size: clamp(9px,1.35vh,18px); color:var(--muted);
            letter-spacing:.09em; line-height:1.15; margin-top:.25em; }
  .readout{ font-size: clamp(12px,1.65vh,24px); letter-spacing:.12em; text-indent:.12em;
            color:var(--navy); opacity:.78; font-variant-numeric:tabular-nums;
            line-height:1; margin-top: clamp(5px,.8vh,12px); }

  /* ---------- scenes 2 & 3: the boards ---------- */
  .board-head{
    flex: 0 0 auto;
    display:flex; align-items:baseline; gap: clamp(10px,1.6vw,26px);
    padding: clamp(4px,1vh,14px) 0 clamp(6px,1.2vh,16px);
  }
  .board-head h2{
    font-size: clamp(18px,3vh,40px); font-weight:600;
    letter-spacing:.2em; text-indent:.2em;
  }
  .board-head .note{
    font-size: clamp(12px,1.7vh,23px); color:var(--muted);
    letter-spacing:.08em;
  }
  .board-head .note b{ color: var(--crimson); font-weight:600; }

  .board{
    flex: 1 1 auto; min-height: 0;
    display: grid;
    grid-template-columns: max-content minmax(0,1fr) max-content max-content max-content;
    align-content: start;
    background: var(--card);
    border-radius: 3px;
    box-shadow: 0 10px 26px rgba(28,63,149,.13);
    overflow: hidden;
  }

  .board > *{
    display: flex; align-items: center;
    padding: 0 clamp(8px,1.4vw,26px);
    border-bottom: 1px solid var(--rule);
    min-width: 0;
  }
  .board > .hd{
    font-size: clamp(10px,1.3vh,17px); color: var(--muted);
    letter-spacing:.18em; text-indent:.18em;
    padding-top: clamp(6px,1.1vh,14px); padding-bottom: clamp(6px,1.1vh,14px);
    border-bottom-color: rgba(28,63,149,.22);
  }
  .board > .cell{ padding-top: clamp(5px,.9vh,13px); padding-bottom: clamp(5px,.9vh,13px); }

  /* a today row: crimson edge on the time cell, faint wash across */
  .board > .cell.today{ background: rgba(196,18,48,.055); }
  .board > .cell.today.c-time{ box-shadow: inset 3px 0 0 var(--crimson); }
  .board > .cell.gone{ opacity: .42; }

  .c-time{ font-size: clamp(17px,2.85vh,39px); font-weight:600;
           font-variant-numeric: tabular-nums; letter-spacing:.02em; }
  .cell.today .c-time-v{ color: var(--crimson); }

  .place{ display:flex; align-items:baseline; gap:.55em; min-width:0; }
  .place b{ font-size: clamp(16px,2.6vh,36px); font-weight:500; letter-spacing:.05em;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .place i{ font-style:normal; font-size: clamp(11px,1.55vh,21px); color:var(--muted);
            letter-spacing:.09em; white-space:nowrap; }

  .c-flight{ font-size: clamp(13px,1.95vh,27px); font-variant-numeric: tabular-nums;
             letter-spacing:.06em; white-space:nowrap; }
  .c-when{ font-size: clamp(12px,1.8vh,25px); letter-spacing:.09em; white-space:nowrap; }
  .c-when .chip{ color: var(--crimson); font-weight:600; letter-spacing:.16em; }
  .c-when .off{ color: var(--muted); letter-spacing:.14em; }

  .c-seats{ font-size: clamp(12px,1.75vh,24px); letter-spacing:.08em; white-space:nowrap;
            justify-content:flex-end; }
  .c-seats .free{ color: var(--green); font-weight:600; }
  .c-seats .full{ color: var(--muted); }

  .board .empty{
    grid-column: 1 / -1; justify-content:center; border-bottom:none;
    color: var(--muted); font-size: clamp(13px,1.95vh,26px); letter-spacing:.12em;
    padding: clamp(20px,5vh,60px) 0;
  }

  /* ---------- scene 5: the destination map ---------- */
  #sc-map{ padding:0; overflow:hidden; border-radius:3px; }
  #map{ position:absolute; inset:0; background:var(--paper); z-index:0; }
  .leaflet-container{ background:var(--paper); outline:none; font:inherit; }
  /* no filter on the tile pane: a filter forces every tile to be
     re-processed on every frame of a zoom, and that was the cost */
  .leaflet-tile{ will-change: transform; }
  /* names fade back in gently, but vanish instantly — a fade-out just
     means watching them smear on the way out */
  .leaflet-pane.labels-pane{ opacity:1; transition: opacity .55s ease; }
  .leaflet-pane.labels-pane.hushed{ opacity:0; transition: none; }
  .leaflet-control-attribution{
    background: rgba(255,255,255,.72) !important; color: rgba(107,122,148,.8) !important;
    font-size: 9px !important; letter-spacing:.04em; padding: 2px 7px !important;
  }
  .leaflet-control-attribution a{ color: var(--navy) !important; }
  .m-vig{
    position:absolute; inset:0; z-index:400; pointer-events:none;
    background: radial-gradient(128% 104% at 50% 45%, rgba(242,244,248,0) 40%,
                rgba(236,239,245,.5) 80%, rgba(227,232,241,.9) 100%);
  }

  .pin{ background:none; border:0; }
  .pin i{
    display:block; width:100%; height:100%; border-radius:50%;
    background:#FFFFFF center/72% no-repeat;
    box-shadow: 0 0 0 1.5px rgba(176,138,46,.55), 0 8px 20px rgba(28,63,149,.22);
    transition: transform .6s cubic-bezier(.22,.9,.26,1), box-shadow .6s ease;
  }
  .pin.live i{
    transform: scale(1.5);
    box-shadow: 0 0 0 2px var(--gold), 0 0 26px 7px rgba(196,18,48,.18), 0 12px 28px rgba(28,63,149,.3);
  }
  .pin.live::after{
    content:''; position:absolute; inset:-60%; border-radius:50%;
    border:1px solid rgba(196,18,48,.45); animation: halo 2.8s ease-out infinite;
  }
  @keyframes halo{ 0%{ transform:scale(.45); opacity:.8; } 100%{ transform:scale(1.5); opacity:0; } }

  .m-cap{
    position:absolute; z-index:600; left: clamp(6px,1vw,22px); bottom: clamp(10px,2vh,30px);
    max-width: min(46%, 640px);
    opacity:0; transform: translateY(18px);
    transition: opacity .8s ease, transform .8s cubic-bezier(.22,.9,.26,1);
  }
  .m-cap.on{ opacity:1; transform:none; }
  .m-cap .kicker{
    font-size: clamp(9px,1.15vh,15px); letter-spacing:.42em; text-indent:.42em;
    text-transform:uppercase; color:var(--crimson); font-weight:600;
  }
  .m-cap h2{
    font-size: clamp(26px,5.6vh,72px); font-weight:500; line-height:1.03;
    margin-top: clamp(6px,1.2vh,16px); color:var(--navy);
  }
  .m-cap .m-rule{
    width: clamp(40px,5vw,96px); height:1px; margin: clamp(10px,1.5vh,20px) 0;
    background: linear-gradient(90deg, var(--gold), rgba(176,138,46,0));
  }
  .m-cap .m-cities{
    font-size: clamp(11px,1.6vh,23px); font-weight:300; letter-spacing:.2em;
    text-transform:uppercase; color:var(--muted);
  }

  .wx{
    display:inline-flex; align-items:center; gap: clamp(8px,1vw,15px);
    margin-top: clamp(10px,1.6vh,22px);
    padding: clamp(6px,1vh,13px) clamp(11px,1.3vw,20px);
    background: rgba(255,255,255,.92); border-radius:999px;
    box-shadow: 0 0 0 1px rgba(176,138,46,.32), 0 10px 26px rgba(28,63,149,.13);
    opacity:0; transform: translateY(8px);
    transition: opacity .6s ease, transform .6s cubic-bezier(.22,.9,.26,1);
  }
  .wx.ready{ opacity:1; transform:none; }
  .wx svg{ width: clamp(19px,2.5vh,34px); height: clamp(19px,2.5vh,34px); display:block; flex:0 0 auto; }
  .wx .deg{ font-size: clamp(17px,2.8vh,37px); font-weight:500; color:var(--navy);
            font-variant-numeric:tabular-nums; line-height:1; }
  .wx .sky{ font-size: clamp(9px,1.2vh,15px); letter-spacing:.2em; text-indent:.2em;
            text-transform:uppercase; color:var(--muted); line-height:1; }
  .wx .sep{ width:1px; height: clamp(17px,2.4vh,32px); background: var(--rule); }
  .wx .clock{ display:flex; flex-direction:column; gap:.3em; }
  .wx .clock b{ font-size: clamp(17px,2.8vh,37px); font-weight:500; color:var(--navy);
                font-variant-numeric:tabular-nums; line-height:1; letter-spacing:.02em; }
  .wx .clock i{ font-style:normal; font-size: clamp(8px,1.05vh,13px); letter-spacing:.24em;
                text-indent:.24em; text-transform:uppercase; color:var(--muted); line-height:1; }

  .ic-sun{ fill:#E0A21C; } .ic-cloud{ fill:#8FA2BE; } .ic-cloud2{ fill:#B9C6DA; }
  .ic-rain{ stroke:#4E82C8; stroke-width:2.6; stroke-linecap:round; fill:none; }
  .ic-snow{ stroke:#7FA8D8; stroke-width:2.2; stroke-linecap:round; fill:none; }
  .ic-bolt{ fill:#E0A21C; }
  .ic-fog{ stroke:#9AAAC2; stroke-width:2.6; stroke-linecap:round; fill:none; }

  .reel{
    position:absolute; z-index:600; top:50%; right: clamp(10px,1.8vw,44px);
    height: min(82%, 70vh);
    aspect-ratio: 9 / 16;
    width: auto;
    transform: translate(calc(100% + 6vw), -50%); opacity:0;
    transition: transform 1s cubic-bezier(.22,.9,.26,1), opacity .7s ease;
    border-radius: clamp(12px,1.4vw,22px); background: var(--card);
    box-shadow: 0 0 0 1px rgba(176,138,46,.55), 0 44px 96px rgba(28,63,149,.34),
                0 8px 24px rgba(28,63,149,.20);
    overflow:hidden;
  }
  .reel.on{ transform: translate(0,-50%); opacity:1; }
  .reel video{ width:100%; height:100%; object-fit:cover; display:block; background:#0B1330; }
  .reel img.shot{
    width:100%; height:100%; object-fit:cover; display:block; background:#0B1330;
    transform-origin:50% 45%; animation: drift 16s ease-in-out infinite alternate;
  }
  @keyframes drift{
    from{ transform: scale(1.02) translate(0,0); }
    to  { transform: scale(1.13) translate(-1.5%, -2%); }
  }
  .reel .label{
    position:absolute; left:0; right:0; bottom:0; padding: 14% 9% 8%;
    background: linear-gradient(180deg, rgba(8,14,32,0) 0%, rgba(8,14,32,.72) 62%, rgba(8,14,32,.9) 100%);
    color:#fff; text-align:center; pointer-events:none;
  }
  .reel .label b{ display:block; font-size: clamp(12px,1.9vh,26px); font-weight:500;
                  letter-spacing:.14em; text-transform:uppercase; }
  .reel .label span{ display:block; margin-top:.5em; font-size: clamp(8px,1.1vh,14px);
                     letter-spacing:.28em; text-indent:.28em; text-transform:uppercase;
                     color: rgba(255,255,255,.72); }
  .reel .label .by{
    display:block; margin-top:.9em; font-size: clamp(7px,.85vh,11px);
    letter-spacing:.05em; color: rgba(255,255,255,.46); font-style:normal;
  }
  @media (prefers-reduced-motion: reduce){ .reel img.shot{ animation:none; } }
  .reel .waiting{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap: clamp(10px,1.6vh,20px);
    text-align:center; padding:8%;
    background: radial-gradient(90% 60% at 50% 16%, rgba(176,138,46,.10) 0%, rgba(255,255,255,0) 70%),
                linear-gradient(165deg, #FFFFFF 0%, #EDF1F7 100%);
  }
  .reel .waiting .ring{
    width: clamp(40px,5vh,70px); height: clamp(40px,5vh,70px); border-radius:50%;
    border:1px solid rgba(176,138,46,.6); display:flex; align-items:center; justify-content:center;
  }
  .reel .waiting .ring::after{
    content:''; width:0; height:0; margin-left:18%;
    border-left: clamp(10px,1.35vh,18px) solid var(--gold);
    border-top: clamp(6px,.85vh,12px) solid transparent;
    border-bottom: clamp(6px,.85vh,12px) solid transparent;
  }
  .reel .waiting b{ font-size: clamp(13px,2.1vh,29px); font-weight:500; letter-spacing:.1em;
                    text-transform:uppercase; color:var(--navy); }
  .reel .waiting span{ font-size: clamp(9px,1.2vh,15px); letter-spacing:.3em; text-indent:.3em;
                       text-transform:uppercase; color:var(--gold); }

  /* ---------- the aircraft that flies between countries ---------- */
  .plane{ background:none; border:0; }
  .plane .body{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    will-change: transform;
  }
  .plane .body svg{ width:100%; height:100%; display:block;
    filter: drop-shadow(0 5px 11px rgba(16,32,72,.45)) drop-shadow(0 1px 2px rgba(16,32,72,.28)); }
  /* white, with a hairline so it still reads against a pale map */
  .pl-hull{ fill:#FFFFFF; stroke:rgba(28,63,149,.5);  stroke-width:.9; stroke-linejoin:round; }
  .pl-trim{ fill:#FFFFFF; stroke:rgba(28,63,149,.45); stroke-width:.8; stroke-linejoin:round; }
  .pl-eng { fill:#F0F3F9; stroke:rgba(28,63,149,.45); stroke-width:.8; }

  .m-ticks{
    position:absolute; z-index:600; bottom: clamp(8px,1.4vh,18px); left:50%;
    transform:translateX(-50%); display:flex; gap: clamp(4px,.5vw,8px);
  }
  .m-ticks button{
    appearance:none; background:none; border:0; margin:0; padding:7px 2px;
    cursor:pointer; line-height:0; -webkit-tap-highlight-color:transparent;
  }
  .m-ticks button i{
    display:block; width: clamp(10px,1.1vw,22px); height:2px; border-radius:1px;
    background: rgba(28,63,149,.18);
    transition: background .4s ease, transform .3s cubic-bezier(.22,.9,.26,1);
  }
  .m-ticks button:hover i{ background: rgba(28,63,149,.45); transform: scaleY(2.4); }
  .m-ticks button.on i{ background: var(--crimson); transform: scaleY(2); }
  .m-ticks button:focus-visible{ outline:1px solid var(--crimson); outline-offset:2px; border-radius:3px; }
  body.idle .m-ticks button{ cursor:none; }

  /* ---------- footer ---------- */
  .foot{
    flex: 0 0 auto;
    display:flex; align-items:center; justify-content:center; position:relative;
    padding-top: clamp(6px,1.2vh,16px);
    font-size: clamp(9px,1.25vh,16px); letter-spacing:.22em; text-indent:.22em;
    color: var(--muted);
  }
  .dots{ position:absolute; right:0; display:flex; align-items:center; gap:3px; }
  .dots button{
    appearance:none; background:none; border:0; padding:6px 4px; margin:0;
    cursor:pointer; line-height:0; -webkit-tap-highlight-color:transparent;
  }
  .dots button i{
    display:block; width:7px; height:7px; border-radius:50%;
    background: var(--navy); opacity:.22;
    transition: opacity .4s ease, transform .3s cubic-bezier(.22,.9,.26,1);
  }
  .dots button:hover i{ opacity:.55; transform:scale(1.25); }
  .dots button.on i{ opacity:.9; background: var(--crimson); transform:scale(1.15); }
  .dots button:focus-visible{ outline:1px solid var(--crimson); outline-offset:2px; border-radius:4px; }
  body.idle .dots button{ cursor:none; }

  /* ---------- the chooser, opened by double-clicking the logo ---------- */
  .sheet{
    position:fixed; inset:0; z-index:900; display:none;
    align-items:center; justify-content:center; padding: clamp(14px,3vh,40px);
    background: rgba(18,28,58,.42); backdrop-filter: blur(3px); cursor:default;
  }
  .sheet.open{ display:flex; }
  .sheet .panel{
    background: var(--card); border-radius:6px; width:min(880px,100%); max-height:100%;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow: 0 0 0 1px rgba(176,138,46,.4), 0 40px 90px rgba(18,28,58,.4);
  }
  .sheet header{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    padding: clamp(14px,2.2vh,24px) clamp(16px,2.4vw,30px) clamp(10px,1.6vh,18px);
    border-bottom:1px solid var(--rule);
  }
  .sheet header h3{ font-size: clamp(15px,2.1vh,24px); font-weight:600;
                    letter-spacing:.18em; text-indent:.18em; text-transform:uppercase; color:var(--navy); }
  .sheet header p{ font-size: clamp(10px,1.3vh,14px); color:var(--muted); letter-spacing:.06em; }
  .sheet .body{ overflow:auto; padding: clamp(12px,2vh,22px) clamp(16px,2.4vw,30px); }
  .sheet h4{
    font-size: clamp(9px,1.15vh,12px); letter-spacing:.3em; text-indent:.3em;
    text-transform:uppercase; color:var(--gold); margin: clamp(10px,1.6vh,18px) 0 clamp(7px,1vh,12px);
  }
  .sheet h4:first-child{ margin-top:0; }
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap:6px 14px; }
  .opt{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:8px 10px; border-radius:4px; border:1px solid transparent;
    font-size: clamp(12px,1.55vh,17px); color:var(--navy);
  }
  .opt:hover{ background: rgba(28,63,149,.045); border-color: var(--rule); }
  .opt input{ appearance:none; width:17px; height:17px; flex:0 0 auto; margin:0;
              border:1.5px solid rgba(28,63,149,.38); border-radius:3px; cursor:pointer;
              position:relative; transition: background .2s ease, border-color .2s ease; }
  .opt input:checked{ background: var(--crimson); border-color: var(--crimson); }
  .opt input:checked::after{
    content:''; position:absolute; left:5px; top:1.5px; width:4px; height:9px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(42deg);
  }
  .opt.off{ color: var(--muted); }
  .opt small{ display:block; font-size:.72em; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; }
  .sheet footer{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding: clamp(11px,1.8vh,18px) clamp(16px,2.4vw,30px);
    border-top:1px solid var(--rule); background: #FBFCFE;
  }
  .sheet .warn{ font-size: clamp(10px,1.3vh,14px); color: var(--crimson); opacity:0; transition:opacity .3s ease; }
  .sheet .warn.show{ opacity:1; }
  .sheet .btns{ display:flex; gap:10px; }
  .sheet button.act{
    appearance:none; font:inherit; cursor:pointer; border-radius:4px;
    padding: clamp(8px,1.2vh,12px) clamp(14px,1.8vw,26px);
    font-size: clamp(11px,1.4vh,15px); letter-spacing:.16em; text-transform:uppercase;
  }
  .sheet button.ghost{ background:none; border:1px solid var(--rule); color:var(--muted); }
  .sheet button.ghost:hover{ border-color: rgba(28,63,149,.34); color:var(--navy); }
  .sheet button.solid{ background: var(--navy); border:1px solid var(--navy); color:#fff; }
  .sheet button.solid:hover{ background:#173584; }

  /* ---------- footer ---------- */

  .hint{
    position: fixed; inset: auto 0 clamp(8px,1.6vh,20px) 0; text-align:center;
    font-size:12px; letter-spacing:.16em; text-indent:.16em; color:var(--muted);
    opacity:.8; transition: opacity .9s ease; pointer-events:none;
  }
  .hint.gone{ opacity:0; }

  /* one orchestrated moment: hands settle into place on load */
  .h-hand, .m-hand, .s-hand{ transition: transform 1.15s cubic-bezier(.22,.9,.26,1); }
  body.running .h-hand,
  body.running .m-hand,
  body.running .s-hand{ transition:none; }

  @media (prefers-reduced-motion: reduce){
    .h-hand,.m-hand,.s-hand{ transition:none; }
    .scene{ transition:none; }
  }

  @media (max-width: 1280px){
    :root{ --face: clamp(72px, min(21vw, 24vh), 230px); }
    .row{ --cols: 4; }
  }
  @media (max-width: 860px){
    :root{ --face: clamp(64px, min(27vw, 22vh), 190px); }
    .row{ --cols: 3; }
    .c-flight, .board > .hd.h-flight{ display:none; }
  }
  @media (max-width: 560px){
    :root{ --face: clamp(56px, 30vw, 150px); }
    .row{ --cols: 2; }
  }
</style>
</head>
<body>

  <div class="mark" id="mark"></div>

  <div class="stage">
    <section class="scene" id="sc-clocks"><div class="row" id="row"></div></section>
    <section class="scene" id="sc-clocks2"><div class="row" id="row2"></div></section>

    <section class="scene" id="sc-departures">
      <div class="board-head"><h2>DEPARTURES</h2><div class="note" id="note-dep"></div></div>
      <div class="board" id="board-dep"></div>
    </section>

    <section class="scene" id="sc-arrivals">
      <div class="board-head"><h2>ARRIVALS</h2><div class="note" id="note-arr"></div></div>
      <div class="board" id="board-arr"></div>
    </section>

    <section class="scene" id="sc-map">
      <div id="map"></div>
      <div class="m-vig"></div>
      <div class="m-cap" id="mCap">
        <div class="kicker">Al-Naser flies to</div>
        <h2 id="mName">—</h2>
        <div class="m-rule"></div>
        <div class="m-cities" id="mCities"></div>
        <div class="wx" id="wx"></div>
      </div>
      <div class="reel" id="reel"></div>
      <div class="m-ticks" id="mTicks"></div>
    </section>
  </div>

  <div class="foot"><span id="date"></span><span class="dots" id="dots"></span></div>
  <p class="hint" id="hint">Tap the logo for fullscreen &nbsp;·&nbsp; double-tap it to choose screens</p>

  <div class="sheet" id="sheet">
    <div class="panel">
      <header>
        <h3>Choose what shows</h3>
        <p>Saved on this screen. Untick anything you don't want in the rotation.</p>
      </header>
      <div class="body">
        <h4>Screens</h4>
        <div class="grid" id="optScenes"></div>
        <h4>On the destination map</h4>
        <div class="grid" id="optPlaces"></div>
      </div>
      <footer>
        <span class="warn" id="sheetWarn">Keep at least one screen switched on.</span>
        <div class="btns">
          <button class="act ghost" id="sheetAll">All on</button>
          <button class="act solid" id="sheetDone">Done</button>
        </div>
      </footer>
    </div>
  </div>

/* ================= scene 1 — the clocks ========================== */

function face(id){
  const svg  = el('svg', { viewBox:'0 0 200 200' });
  const defs = el('defs');
  const grad = el('radialGradient', { id, cx:'50%', cy:'32%', r:'78%' });
  const a = el('stop', { offset:'0%'   }); a.style.stopColor = 'var(--dial-hi)';
  const b = el('stop', { offset:'100%' }); b.style.stopColor = 'var(--dial-lo)';
  grad.append(a, b); defs.appendChild(grad); svg.appendChild(defs);

  svg.appendChild(el('circle', { class:'rim',  cx:100, cy:100, r:97 }));
  svg.appendChild(el('circle', { cx:100, cy:100, r:93.5, fill:`url(#${id})` }));
  svg.appendChild(el('circle', { class:'edge', cx:100, cy:100, r:93.5 }));

  for (let i = 0; i < 60; i++){
    const rot = `rotate(${i*6} 100 100)`;
    if (i % 5 === 0){
      const q = i % 15 === 0;
      svg.appendChild(el('rect', { class: q ? 'baton qtr' : 'baton',
        x: 100 - (q?1.7:1.1), y: q?66:70, width: q?3.4:2.2, height: q?16:12,
        rx:1, transform:rot }));
    } else {
      svg.appendChild(el('rect', { class:'tick', x:99.75, y:80.5,
        width:.5, height:3.6, transform:rot }));
    }
  }

  const hour   = el('polygon', { class:'h-hand', points:'100,50 102.3,99 100,113 97.7,99' });
  const minute = el('polygon', { class:'m-hand', points:'100,27 101.7,99 100,115 98.3,99' });
  const second = el('g', { class:'s-hand' });
  second.appendChild(el('rect',   { x:99.6, y:24, width:.8, height:92 }));
  second.appendChild(el('circle', { cx:100, cy:114, r:3.4 }));

  svg.append(hour, minute, second);
  svg.appendChild(el('circle', { class:'cap',    cx:100, cy:100, r:4.2 }));
  svg.appendChild(el('circle', { class:'cap-in', cx:100, cy:100, r:1.5 }));
  return { svg, hour, minute, second };
}

const dials = CLOCKS.map((c, i) => {
  const wrap = document.createElement('div'); wrap.className = 'clock';
  const f = face('dial' + i);
  const disc = document.createElement('div'); disc.className = 'dial'; disc.appendChild(f.svg);
  const name = document.createElement('div'); name.className = 'city';    name.textContent = c.label;
  const ctry = document.createElement('div'); ctry.className = 'country'; ctry.textContent = c.country || '';
  const read = document.createElement('div'); read.className = 'readout'; read.textContent = '--:--';
  wrap.append(disc, name, ctry, read);
  $(i < CLOCKS_PER_SCREEN ? 'row' : 'row2').appendChild(wrap);
  return { ...c, ...f, read, offset: 0, lastMin: -1 };
});

/* each zone's offset from UTC — picks up daylight saving automatically */
function offsetOf(zone, when){
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: zone, hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit' }).formatToParts(when);
  const g = t => +p.find(x => x.type === t).value;
  return Date.UTC(g('year'), g('month')-1, g('day'), g('hour')%24, g('minute'), g('second'))
       - Math.floor(when.getTime()/1000)*1000;
}
function refreshOffsets(){
  const now = new Date();
  dials.forEach(d => { d.offset = offsetOf(d.zone, now); });
}
refreshOffsets();
setInterval(refreshOffsets, 30000);

let clocksVisible = true;

function tick(){
  if (clocksVisible){
    const now = Date.now();
    for (const d of dials){
      const t   = new Date(now + d.offset);
      const sec = t.getUTCSeconds();
      const s   = sec + (SWEEP ? t.getUTCMilliseconds()/1000 : 0);
      d.second.setAttribute('transform', `rotate(${s*6} 100 100)`);

      // hour and minute hands only move once a minute — across fourteen dials
      // that is the difference between a smooth sweep and a stuttering one
      const mm = t.getUTCMinutes();
      if (mm !== d.lastMin){
        d.lastMin = mm;
        const hh = t.getUTCHours();
        const m  = mm + sec/60, h = hh + m/60;
        d.minute.setAttribute('transform', `rotate(${m*6} 100 100)`);
        d.hour  .setAttribute('transform', `rotate(${h*30} 100 100)`);
        d.read.textContent = USE_24H
          ? String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0')
          : (hh%12||12) + ':' + String(mm).padStart(2,'0') + (hh<12?' am':' pm');
      }
    }
  }
  if (SWEEP) requestAnimationFrame(tick); else setTimeout(tick, 250);
}
tick();
requestAnimationFrame(() =>
  requestAnimationFrame(() => document.body.classList.add('running')));

/* "now" and "today" as they are at the counter in Bahrain, not on the
   machine driving the screen — the two can differ if the player's
   own time zone is set wrong. */
function homeParts(){
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: HOME_ZONE, hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit' }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { key: `${g('year')}-${g('month')}-${g('day')}`,
           mins: (+g('hour') % 24) * 60 + (+g('minute')) };
}

const WEEK  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function prettyDate(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return `${WEEK[dt.getUTCDay()]} ${d} ${MONTH[m-1]}`;
}
const toMins = t => (+t.slice(0,2)) * 60 + (+t.slice(3,5));

function upcoming(list){
  const { key, mins } = homeParts();
  return list.filter(f => {
    if (f.date > key) return true;
    if (f.date < key) return false;
    return toMins(f.time) >= mins - KEEP_GONE;
  }).slice(0, ROWS).map(f => ({
    ...f,
    today: f.date === key,
    gone:  f.date === key && toMins(f.time) < mins,
  }));
}

function cell(cls, html){
  const d = document.createElement('div');
  d.className = 'cell ' + cls;
  d.innerHTML = html;
  return d;
}

function drawBoard(target, list, kind){
  const board = $(target);
  board.textContent = '';
  const arriving = kind === 'arrivals';

  const heads = ['TIME', arriving ? 'FROM' : 'DESTINATION', 'FLIGHT',
                 'DATE', (arriving || !SHOW_SEATS) ? 'NIGHTS' : 'SEATS'];
  heads.forEach((h, i) => {
    const d = document.createElement('div');
    d.className = 'hd' + (i === 2 ? ' h-flight' : '');
    if (i === 4) d.style.justifyContent = 'flex-end';
    d.textContent = h;
    board.appendChild(d);
  });

  const rows = upcoming(list);
  if (!rows.length){
    const e = document.createElement('div');
    e.className = 'cell empty';
    e.textContent = arriving ? 'No groups returning in this period'
                             : 'No departures scheduled in this period';
    board.appendChild(e);
    return;
  }

  for (const f of rows){
    const flag = (f.today ? ' today' : '') + (f.gone ? ' gone' : '');
    const via  = f.via && f.via.length ? `<i>via ${f.via.join(' · ')}</i>` : '';
    const port = arriving
      ? (f.dest !== 'BAH' ? `<i>into ${f.dest}</i>` : '')
      : (f.org  !== 'BAH' ? `<i>from ${f.org}</i>`  : '');

    board.append(
      cell('c-time' + flag, `<span class="c-time-v">${f.time}</span>`),
      cell('c-place' + flag, `<span class="place"><b>${f.city}</b>${via}${port}</span>`),
      cell('c-flight' + flag, f.no),
      cell('c-when' + flag,
        f.gone  ? `<span class="off">${arriving ? 'LANDED' : 'DEPARTED'}</span>`
      : f.today ? `<span class="chip">TODAY</span>`
                : prettyDate(f.date)),
      cell('c-seats' + flag,
        (arriving || !SHOW_SEATS) ? `${f.nights}N`
      : f.avail === null || f.avail === undefined ? ''
      : f.avail > 0 ? `<span class="free">${f.avail} free</span>`
                    : `<span class="full">Full</span>`)
    );
  }
}

function todayNote(list, kind){
  const { key } = homeParts();
  const n = list.filter(f => f.date === key).length;
  if (n) return `<b>${n}</b> ${kind === 'arrivals'
    ? (n === 1 ? 'group returns today' : 'groups return today')
    : (n === 1 ? 'departure today'     : 'departures today')}`;
  const next = upcoming(list)[0];
  return next ? `Next ${kind === 'arrivals' ? 'arrival' : 'departure'} ${prettyDate(next.date)}`
              : '';
}

function refreshBoards(){
  drawBoard('board-dep', FLIGHTS.departures, 'departures');
  drawBoard('board-arr', FLIGHTS.arrivals,   'arrivals');
  $('note-dep').innerHTML = todayNote(FLIGHTS.departures, 'departures');
  $('note-arr').innerHTML = todayNote(FLIGHTS.arrivals,   'arrivals');
}
refreshBoards();
setInterval(refreshBoards, 60000);

const weather = new Array(PLACES.length).fill(null);
async function loadWeather(){
  try{
    const r = await fetch('https://api.open-meteo.com/v1/forecast'
      + `?latitude=${PLACES.map(p=>p.lat).join(',')}&longitude=${PLACES.map(p=>p.lng).join(',')}`
      + '&current=temperature_2m,weather_code&timezone=auto');
    if (!r.ok) return;
    const data = await r.json();
    (Array.isArray(data) ? data : [data]).forEach((row, n) => {
      if (row && row.current)
        weather[n] = { temp: Math.round(row.current.temperature_2m), code: row.current.weather_code };
    });
  }catch(_){ /* leave the pill hidden and try again next time */ }
}
function localTime(zone){
  try{
    return new Intl.DateTimeFormat('en-GB', { timeZone: zone, hour:'2-digit', minute:'2-digit',
      hour12: !USE_24H }).format(new Date());
  }catch(_){ return ''; }
}

          + `<span class="deg">${w.temp}&deg;</span><span class="sep"></span>`
          + `<span class="sky">${label}</span>`;
  }
  if (time){
    if (w) html += '<span class="sep"></span>';
    html += `<span class="clock"><b id="wxClock">${time}</b><i>local time</i></span>`;
  }
  wxBox.innerHTML = html;
  wxBox.classList.add('ready');

  clearInterval(wxTick);
  wxTick = setInterval(() => {

/* --- the map itself, built the first time it is needed --- */
/* the pin badge is the emblem lifted out of the logo, cropped here so
   the artwork only lives in the file once */
let PIN_SRC = '';
const pinReady = new Promise(done => {
  const img = new Image();
  img.onload = () => {
    const sw = Math.round(img.width * 0.60), sh = Math.round(img.height * 0.72);
    const box = Math.max(sw, sh), out = 220, k = out / box;
    const c = document.createElement('canvas'); c.width = c.height = out;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0, sw, sh, (out - sw*k)/2, (out - sh*k)/2, sw*k, sh*k);
    try{ PIN_SRC = c.toDataURL('image/png'); }catch(_){}
    done();
  };
  img.onerror = () => done();
  img.src = LOGO_SRC;
});

let lmap = null, markers = [], mapReady = false, labelsReady = false;

/* The place names are raster images like the rest of the map, so they
   stretch while it zooms. They are switched off for the whole journey
   and brought back once the map has come to rest. */
function labelsOff(){
  if (labelsReady) lmap.getPane('labels').classList.add('hushed');
}
function labelsOn(){
  if (labelsReady) lmap.getPane('labels').classList.remove('hushed');
}
async function buildMap(){
  if (mapReady) return;
  await pinReady;
  mapReady = true;
  lmap = L.map('map', {
    zoomControl:false, attributionControl:true,
    dragging:false, scrollWheelZoom:false, doubleClickZoom:false,
    boxZoom:false, keyboard:false, touchZoom:false,
    zoomSnap:0, zoomDelta:0, wheelPxPerZoomLevel:9999, inertia:false,
  }).setView([30, 46], 2.7);
  const ESRI = 'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/';
  L.tileLayer(ESRI + 'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:16, crossOrigin:true, keepBuffer:6, updateWhenZooming:false,
    attribution:'Esri, HERE, Garmin, &copy; OpenStreetMap contributors'
  }).addTo(lmap);

  /* The place names get their own pane. Raster text smears badly when it is
     scaled through a zoom, so it is faded out while the map is moving and
     brought back once it settles — you only read it standing still. */
  lmap.createPane('labels');
  const labelPane = lmap.getPane('labels');
  labelPane.classList.add('labels-pane');
  labelPane.style.zIndex = 250;
  labelPane.style.pointerEvents = 'none';
  L.tileLayer(ESRI + 'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    pane:'labels', maxZoom:16, crossOrigin:true, keepBuffer:6, updateWhenZooming:false
  }).addTo(lmap);

  labelsReady = true;

  const size = Math.round(Math.min(56, Math.max(28, window.innerHeight * .042)));

                      html:`<i style="background-image:url('${PIN_SRC}')"></i>` })
  }).addTo(lmap));
  refreshFilms();
}

/* ---- the arc between two cities, and the aircraft along it ---- */
const R2D = 180 / Math.PI, D2R = Math.PI / 180;

function greatCircle(a, b, n){
  const f1 = a[0]*D2R, l1 = a[1]*D2R, f2 = b[0]*D2R, l2 = b[1]*D2R;
  const d = 2 * Math.asin(Math.sqrt(
    Math.sin((f2-f1)/2)**2 + Math.cos(f1)*Math.cos(f2)*Math.sin((l2-l1)/2)**2));
  if (!d || !isFinite(d)) return [a, b];
  const pts = [];
  for (let i = 0; i <= n; i++){
    const t = i/n;
    const A = Math.sin((1-t)*d)/Math.sin(d), B = Math.sin(t*d)/Math.sin(d);
    const x = A*Math.cos(f1)*Math.cos(l1) + B*Math.cos(f2)*Math.cos(l2);
    const y = A*Math.cos(f1)*Math.sin(l1) + B*Math.cos(f2)*Math.sin(l2);
    const z = A*Math.sin(f1) + B*Math.sin(f2);
    pts.push([Math.atan2(z, Math.hypot(x, y)) * R2D, Math.atan2(y, x) * R2D]);
  }
  return pts;
}

/* the exact point a fraction t along the great circle — solved
   continuously, so the aircraft never steps between fixed positions */
function gcAt(a, b, t){
  const f1 = a[0]*D2R, l1 = a[1]*D2R, f2 = b[0]*D2R, l2 = b[1]*D2R;
  const d = 2 * Math.asin(Math.sqrt(
    Math.sin((f2-f1)/2)**2 + Math.cos(f1)*Math.cos(f2)*Math.sin((l2-l1)/2)**2));
  if (!d || !isFinite(d)) return [b[0], b[1]];
  const A = Math.sin((1-t)*d)/Math.sin(d), B = Math.sin(t*d)/Math.sin(d);
  const x = A*Math.cos(f1)*Math.cos(l1) + B*Math.cos(f2)*Math.cos(l2);
  const y = A*Math.cos(f1)*Math.sin(l1) + B*Math.cos(f2)*Math.sin(l2);
  const z = A*Math.sin(f1) + B*Math.sin(f2);
  return [Math.atan2(z, Math.hypot(x, y)) * R2D, Math.atan2(y, x) * R2D];
}

let planeEl = null, trailLine = null, flightPane = false;
function ensureFlightBits(){
  if (!flightPane){
    lmap.createPane('flight');
    const pane = lmap.getPane('flight');
    pane.style.zIndex = 620; pane.style.pointerEvents = 'none';
    flightPane = true;
  }
  if (!trailLine){
    trailLine = L.polyline([], { pane:'flight', color:'#C41230', weight:2,
      opacity:.55, dashArray:'1 7', lineCap:'round', interactive:false }).addTo(lmap);
  }
  if (!planeEl){
    /* a plain element we place ourselves. A Leaflet marker rounds its
       position to whole pixels, which is what made the flight judder. */
    const size = Math.round(Math.min(96, Math.max(54, window.innerHeight * .082)));
    planeEl = document.createElement('div');
    planeEl.className = 'plane';
    planeEl.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;'
      + `width:${size}px;height:${size}px;margin-left:${-size/2}px;margin-top:${-size/2}px;`
      + 'opacity:0;will-change:transform;';
    planeEl.innerHTML = `<div class="body">${PLANE_SVG}</div>`;
    lmap.getPane('flight').appendChild(planeEl);
  }
}
function clearFlight(){
  if (planeEl) planeEl.style.opacity = '0';
  if (trailLine) trailLine.setLatLngs([]);
}

/* flies the map and walks the aircraft along the arc at the same time.
   The flight is two moves: pull back far enough to take in both cities,
   then drop into the destination. */
async function flyWithPlane(from, to, zoom, secs){
  if (!from){ labelsOff(); await mapFly(to, zoom, secs); labelsOn(); return; }

  const span = L.latLngBounds([from, to]).pad(0.35);
  let wide = lmap.getBoundsZoom(span, false);
  wide = Math.max(2, Math.min(wide - 0.7, zoom - 2.6));   // always a real pull-back

  /* the map and the aircraft never move at the same time — that was
     what made the flight stutter */
  labelsOff();                                            // no smeared text
  await mapFly(span.getCenter(), wide, secs * 0.32);      // climb out
  await runPlane(from, to, secs * 0.42);                  // cruise
  await mapFly(to, zoom, secs * 0.26);                    // descend
  labelsOn();                                             // sharp again
}

/* the aircraft runs on its own clock across the whole flight */
function runPlane(from, to, secs){
  return new Promise(done => {
    ensureFlightBits();
    const full = greatCircle(from, to, 128);
    trailLine.setLatLngs([]);
    planeEl.style.opacity = '1';

    /* the map is holding still for this phase, so we can work in exact
       fractional pixels instead of asking Leaflet for rounded ones */
    const zoom = lmap.getZoom(), origin = lmap.getPixelOrigin();
    const at = ll => { const p = lmap.project(L.latLng(ll[0], ll[1]), zoom);
                       return { x: p.x - origin.x, y: p.y - origin.y }; };
    const body = planeEl.querySelector('.body');
    const t0 = performance.now(), ms = secs * 1000;
    const ease = t => t < .5 ? 2*t*t : 1 - (-2*t + 2)**2 / 2;
    const token = tourToken;
    let lastAng = null, lastTrail = 0;

    (function step(now){
      if (token !== tourToken){ clearFlight(); done(); return; }
      const raw = Math.min(1, (now - t0) / ms), t = ease(raw);

      const here  = gcAt(from, to, t);
      const ahead = gcAt(from, to, Math.min(1, t + 0.005));
      const a = at(here), b = at(ahead);
      planeEl.style.transform = `translate3d(${a.x}px, ${a.y}px, 0)`;

      /* the dashed trail is heavy to redraw, and a few times a
         second is plenty for a dashed line */
      if (now - lastTrail > 90){
        lastTrail = now;
        trailLine.setLatLngs(full.slice(0, Math.max(2, Math.round(t * (full.length - 1)) + 1)));
      }

      if (body){
        let ang = Math.atan2(b.y - a.y, b.x - a.x) * R2D;
        if (lastAng !== null){                    // no sudden flips, and ease the turn
          while (ang - lastAng >  180) ang -= 360;
          while (ang - lastAng < -180) ang += 360;
          ang = lastAng + (ang - lastAng) * 0.35;
        }
        lastAng = ang;
        body.style.transform = `rotate(${ang}deg)`;
      }

      if (raw < 1) requestAnimationFrame(step);
      else { planeEl.style.opacity = '0'; trailLine.setLatLngs([]); done(); }
    })(t0);
  });
}

function mapFly(target, zoom, secs){
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (done) return; done = true; lmap.off('moveend', finish); resolve(); };
    lmap.once('moveend', finish);
    setTimeout(finish, secs * 1000 + 900);
    lmap.flyTo(target, zoom, { duration: secs, easeLinearity:.22 });
  });
}

/* the hold between countries can be cut short by clicking a tick */
let wakeTour = null, pendingJump = null;
function tourHold(ms){
  return new Promise(res => {
    const t = setTimeout(() => { wakeTour = null; res(); }, ms);
    wakeTour = () => { clearTimeout(t); wakeTour = null; res(); };
  });
}

/* one lap of the enabled countries; resolves when it is finished, and
   bails out early if the screen has moved on in the meantime */
let tourToken = 0;
async function runMapTour(){
  const token = ++tourToken;
  const alive = () => token === tourToken;

  await buildMap();
  lmap.invalidateSize({ animate:false });

  const picked = PLACES.map((p, n) => n).filter(n => settings.places[PLACES[n].file]);
  const mTicks = $('mTicks');
  mTicks.innerHTML = '';
  picked.forEach((n, k) => {
    const b = document.createElement('button');
    b.type = 'button'; b.title = PLACES[n].country;
    b.setAttribute('aria-label', 'Show ' + PLACES[n].country);
    b.appendChild(document.createElement('i'));
    b.addEventListener('click', e => {
      e.stopPropagation(); stirred();
      pendingJump = k;
      if (wakeTour) wakeTour();
    });
    mTicks.appendChild(b);
  });

  if (!picked.length){
    $('mName').textContent = 'Nothing selected';
    $('mCities').textContent = 'choose countries from the logo';
    hideWeather();
    mCap.classList.add('on');
    await wait(6000);
    mCap.classList.remove('on');
    return;
  }

  pendingJump = null;
  clearFlight();
  await mapFly([30, 46], 2.7, 1.6);
  if (!alive()) return;

  let k = 0, prev = null;
  while (k < picked.length){
    const n = picked[k], p = PLACES[n];
    markers.forEach((m, j) => m.getElement()?.classList.toggle('live', j === n));
    [...mTicks.children].forEach((t, j) => t.classList.toggle('on', j === k));

    await flyWithPlane(prev, [p.lat, p.lng], p.zoom, MAP_FLY);
    prev = [p.lat, p.lng];
    if (!alive()) return;
    /* somebody picked a different country while it was flying */
    if (pendingJump !== null && pendingJump !== k){ k = pendingJump; pendingJump = null; continue; }
    pendingJump = null;

    $('mName').textContent   = p.country;
    $('mCities').textContent = p.cities;
    showWeather(n);
    mCap.classList.add('on');

    await wait(420);            if (!alive()) return;
    if (haveFilm[n])       showFilm(p);
    else if (havePhoto[n])   showPhoto(p, stillOf(p), '');          // your own picture
    else if (p.shot)         showPhoto(p, p.shot, p.by);            // the demo still
    else                     showWaiting(p);
    reel.classList.add('on');

    await tourHold(MAP_HOLD * 1000); if (!alive()) return;

    reel.classList.remove('on');
    mCap.classList.remove('on');
    hideWeather();
    await wait(760);            if (!alive()) return;
    reel.innerHTML = '';

    if (pendingJump !== null){ k = pendingJump; pendingJump = null; }
    else k++;
  }
  markers.forEach(m => m.getElement()?.classList.remove('live'));
  [...mTicks.children].forEach(t => t.classList.remove('on'));
  await refreshFilms();        // a film may have arrived since the last lap
}

function stopMapTour(){
  tourToken++;
  clearFlight();
  pendingJump = null;
  if (wakeTour) wakeTour();
  reel.classList.remove('on');
  mCap.classList.remove('on');
  hideWeather();
  reel.innerHTML = '';
}

/* ================= what shows, and in what order ================= */

const STORE = 'alnaser.display.v1';
const settings = (() => {
  const base = { scenes:{}, places:{} };
  SCENES.forEach(s => base.scenes[s.id] = true);
  PLACES.forEach(p => base.places[p.file] = true);
  try{
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved){
      Object.keys(base.scenes).forEach(k => { if (k in (saved.scenes||{})) base.scenes[k] = !!saved.scenes[k]; });
      Object.keys(base.places).forEach(k => { if (k in (saved.places||{})) base.places[k] = !!saved.places[k]; });
    }
  }catch(_){}
  return base;
})();
function saveSettings(){
  try{ localStorage.setItem(STORE, JSON.stringify(settings)); }catch(_){}
}

const dots = $('dots');
const liveScenes = () => SCENES.filter(s => settings.scenes[s.id]);

function buildDots(){
  const list = liveScenes();
  dots.innerHTML = '';
  list.forEach((s, n) => {
    const b = document.createElement('button');
    b.type = 'button'; b.title = s.name;
    b.setAttribute('aria-label', 'Show ' + s.name);
    b.appendChild(document.createElement('i'));
    b.addEventListener('click', e => { e.stopPropagation(); stirred(); show(n); });
    dots.appendChild(b);
  });
}

let at = 0, timer = null;
function show(i){
  const list = liveScenes();
  if (!list.length) return;
  at = ((i % list.length) + list.length) % list.length;
  const s = list[at];

  stopMapTour();
  SCENES.forEach(x => $('sc-' + x.id).classList.toggle('on', x.id === s.id));
  [...dots.children].forEach((d, n) => d.classList.toggle('on', n === at));

  clocksVisible = s.id === 'clocks' || s.id === 'clocks2';
  if (s.id === 'departures' || s.id === 'arrivals') refreshBoards();

  clearTimeout(timer);
  if (s.id === 'map'){
    const mine = at;
    runMapTour().then(() => { if (at === mine && !sheetOpen) show(at + 1); });
  } else {
    timer = setTimeout(() => show(at + 1), s.hold * 1000);
  }
}

/* ---- the chooser ---- */
const sheet = $('sheet');
let sheetOpen = false;

function drawSheet(){
  const sc = $('optScenes'); sc.innerHTML = '';
  SCENES.forEach(s => {
    const l = document.createElement('label'); l.className = 'opt' + (settings.scenes[s.id] ? '' : ' off');
    l.innerHTML = `<input type="checkbox" ${settings.scenes[s.id] ? 'checked' : ''}><span>${s.name}</span>`;
    l.querySelector('input').addEventListener('change', e => {
      if (!e.target.checked && liveScenes().length <= 1){
        e.target.checked = true;
        $('sheetWarn').classList.add('show');
        setTimeout(() => $('sheetWarn').classList.remove('show'), 2600);
        return;
      }
      settings.scenes[s.id] = e.target.checked;
      l.classList.toggle('off', !e.target.checked);
      saveSettings(); buildDots();
    });
    sc.appendChild(l);
  });

  const pl = $('optPlaces'); pl.innerHTML = '';
  PLACES.forEach(p => {
    const l = document.createElement('label'); l.className = 'opt' + (settings.places[p.file] ? '' : ' off');
    l.innerHTML = `<input type="checkbox" ${settings.places[p.file] ? 'checked' : ''}>`
                + `<span>${p.country}<small>${p.cities}</small></span>`;
    l.querySelector('input').addEventListener('change', e => {
      settings.places[p.file] = e.target.checked;
      l.classList.toggle('off', !e.target.checked);
      saveSettings();
    });
    pl.appendChild(l);
  });
}

function openSheet(){
  sheetOpen = true;
  clearTimeout(timer);
  stopMapTour();
  drawSheet();
  sheet.classList.add('open');
  document.body.classList.remove('idle');
}
function closeSheet(){
  sheetOpen = false;
  sheet.classList.remove('open');
  buildDots();
  show(Math.min(at, Math.max(0, liveScenes().length - 1)));
}
$('sheetDone').addEventListener('click', e => { e.stopPropagation(); closeSheet(); });
$('sheetAll').addEventListener('click', e => {
  e.stopPropagation();
  SCENES.forEach(s => settings.scenes[s.id] = true);
  PLACES.forEach(p => settings.places[p.file] = true);
  saveSettings(); drawSheet();
});
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
sheet.addEventListener('dblclick', e => e.stopPropagation());

/* the weather is asked for straight away, not when the map first opens,
   so it is never stuck behind a few hundred map tiles */
function pullWeather(){
  return loadWeather().then(() => { if (wxAt >= 0) showWeather(wxAt); });
}
pullWeather();
setInterval(pullWeather, WX_REFRESH * 60 * 1000);

buildDots();
show(0);

/* ---- the date line along the bottom ---- */
function stampDate(){
  $('date').textContent = new Intl.DateTimeFormat('en-GB', { timeZone: HOME_ZONE,
    weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(new Date());
}
stampDate();
setInterval(stampDate, 60000);

/* ---- fullscreen, manual paging, idle cursor, keep-awake ---- */
const hint = $('hint');
setTimeout(() => hint.classList.add('gone'), 6000);

function toggleFullscreen(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 'ArrowRight') show(at + 1);
  if (e.key === 'ArrowLeft')  show(at - 1);
});
document.addEventListener('dblclick', toggleFullscreen);

document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  logoBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  logoBtn.title = on ? 'Exit full screen' : 'Full screen';
});

let idleTimer;
function stirred(){
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
}
['mousemove','mousedown','keydown','touchstart'].forEach(ev =>
  document.addEventListener(ev, stirred));
stirred();

async function keepAwake(){
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }
  catch (_) {}
}
keepAwake();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepAwake();
});
</script>
</body>
</html>
